packages:
  - packages/*
  - apps/*

# catalog 밖의 버전 지정을 막는다(pnpm catalogMode, tide-v0 티켓 16).
catalogMode: strict

# 배포된 지 하루(1440분)가 안 된 버전은 설치하지 않는다. 값을 명시하면 strict가 되어,
# 범위 안에 하루가 지난 버전이 없을 때 새 버전으로 내려가지 않고 실패한다(pnpm 12 dependency-resolution 문서).
minimumReleaseAge: 1440

# 의존성 버전은 기본 catalog 하나로 관리한다. peer 범위와 내부 패키지는 넣지 않는다.
# 0.x인 패키지(oxfmt, publint)는 정확한 버전으로 고정한다.
catalog:
  "@tailwindcss/node": ^4.3.5
  "@tailwindcss/postcss": ^4.3.5
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  clsx: ^2.1.1
  next: ^16.4.5
  oxfmt: 0.77.0
  oxlint: ^1.92.0
  publint: 0.3.25
  react: ^19.3.1
  react-aria: ^3.53.1
  react-dom: ^19.3.1
  react-stately: ^3.51.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  turbo: ^2.11.10
  typescript: ^7.0.2
  vite: ^8.3.6
  vitest: ^5.1.0
