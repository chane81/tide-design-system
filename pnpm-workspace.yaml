packages:
  - packages/*
  - apps/*

# catalog 밖의 버전 지정을 막는다(pnpm catalogMode, tide-v0 티켓 16).
catalogMode: strict

# 배포된 지 하루(1440분)가 안 된 버전은 설치하지 않는다. 값을 명시하면 strict가 되어,
# 범위 안에 하루가 지난 버전이 없을 때 새 버전으로 내려가지 않고 실패한다(pnpm 12 dependency-resolution 문서).
minimumReleaseAge: 1440

# 의존성 버전은 기본 catalog 하나로 관리한다. peer 범위와 내부 패키지는 넣지 않는다.
# 0.x인 패키지(oxfmt, publint, tsdown)는 정확한 버전으로 고정한다.
catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@storybook/addon-a11y": ^10.6.6
  "@storybook/addon-docs": ^10.6.6
  "@storybook/addon-themes": ^10.6.6
  "@storybook/addon-vitest": ^10.6.6
  "@storybook/react-vite": ^10.6.6
  "@tailwindcss/node": ^4.3.5
  "@tailwindcss/postcss": ^4.3.5
  "@tailwindcss/vite": ^4.3.5
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/browser-playwright": ^5.1.0
  clsx: ^2.1.1
  lucide-static: ^1.70.0
  next: ^16.4.5
  oxfmt: 0.77.0
  oxlint: ^1.92.0
  playwright: ^1.65.0
  publint: 0.3.25
  react: ^19.3.1
  react-aria: ^3.53.1
  react-dom: ^19.3.1
  react-stately: ^3.51.0
  storybook: ^10.6.6
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  tsdown: 0.23.7
  turbo: ^2.11.10
  typescript: ^7.0.2
  vite: ^8.3.6
  vitest: ^5.1.0
  vitest-browser-react: ^2.3.0

# 의존성의 build script(postinstall 등) 실행 여부. 목록에 없으면 install이 실패한다(pnpm strictDepBuilds 기본값).
allowBuilds:
  # 플랫폼 바이너리는 optionalDependencies로 설치되므로 postinstall(바이너리 확인)은 돌리지 않는다.
  esbuild: false

permissions:
  tsdown:
    skills: true
