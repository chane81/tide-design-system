# 이미지 기본 default.conf에 Cache-Control만 더했다. 해시 없는 파일은 no-cache, `assets/*`는 1년 immutable(티켓 44).
# add_header는 현재 레벨에 하나도 없을 때만 상속되므로 server가 아닌 location마다 둔다.
server {
    listen       80;
    # 이미지 스크립트는 기본 default.conf일 때만 IPv6 listen을 더하므로 직접 적는다.
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
