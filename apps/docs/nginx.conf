# 문서 사이트(Storybook 정적 빌드) nginx 설정. Dockerfile이 nginx:1.30-alpine의 /etc/nginx/conf.d/default.conf를 이것으로 바꾼다.
# 이미지 기본 default.conf(정적 파일 서빙, 50x 페이지)를 그대로 두고 Cache-Control만 더했다(티켓 44).
#
# 기본 설정에는 Cache-Control이 없어 브라우저가 heuristic caching으로 해시 없는 iframe.html·index.html·index.json을
# 옛 판으로 계속 썼다. 그래서
# - 해시 없는 파일(*.html, index.json, project.json, sb-manager/·sb-addons/ 등): `no-cache`. 쓸 때마다 재검증하고,
#   nginx가 기본으로 붙이는 ETag·Last-Modified로 바뀌지 않았으면 304를 받는다.
# - `assets/*`: Storybook(Vite) 빌드가 파일 이름에 내용 해시를 붙인다. 1년 `immutable`.
#
# nginx 1.30 공식 문서(nginx.org ngx_http_headers_module 「add_header」, ngx_http_core_module 「location」):
# - add_header는 현재 레벨에 add_header가 하나도 없을 때만 바깥 레벨에서 상속된다. 그래서 server 레벨에 두지 않고
#   location마다 하나씩 둔다(바깥에 add_header를 더하면 location 안의 것 때문에 상속되지 않는다).
# - add_header는 always 없이 200·204·206·301·302·303·304·307·308 등에만 붙는다. 304에도 붙고, 404에는 붙지 않는다.
# - 정규식 location이 없으므로 `/assets/`는 가장 긴 prefix로 `/`보다 먼저 고른다.
server {
    listen       80;
    # 이미지의 10-listen-on-ipv6-by-default.sh는 기본 default.conf일 때만 IPv6 listen을 더한다.
    # 파일을 바꾸면 건너뛰므로 기본 동작(IPv4·IPv6 둘 다)을 유지하려고 직접 적는다.
    listen       [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
