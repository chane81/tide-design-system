<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- 바깥 틀은 light가 기본, 보는 환경이 dark면 media query로 바뀐다.
       light·dark 두 패널은 각 Theme의 실제 모습이라 보는 환경과 관계없이 고정이다 -->
  <style>
    .bg { fill: #f5f5f6; }
    .title { fill: #28292c; }
    .t2 { fill: #5b6068; }
    .note { fill: #0060b3; }
    .ln { fill: none; stroke: #82878e; }
    .box { fill: #ffffff; stroke: #bec1c4; }
    .mono { fill: #3f4247; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a1a; }
      .title { fill: #f0f0f0; }
      .t2 { fill: #9a9a9a; }
      .note { fill: #53a3fe; }
      .ln { stroke: #8a8a8a; }
      .box { fill: #2a2b2e; stroke: #5b6068; }
      .mono { fill: #e8e8ea; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ln" d="M0,0 L10,5 L0,10" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="420" rx="16"/>

  <text class="title" x="460" y="40" font-size="18" font-weight="700" text-anchor="middle">data-theme 하나로 같은 이름이 다른 값을 가리킨다</text>

  <!-- Token -->
  <rect class="box" x="30" y="182" width="250" height="64" rx="10"/>
  <text class="mono" x="155" y="210" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">--tide-blue-subtle</text>
  <text class="t2" x="155" y="232" font-size="12" text-anchor="middle">파스텔 바탕 (subtle)</text>

  <line class="ln" x1="280" y1="205" x2="358" y2="135" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line class="ln" x1="280" y1="223" x2="358" y2="293" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- light 패널 -->
  <rect x="360" y="64" width="530" height="140" rx="12" fill="#ffffff" stroke="#bec1c4"/>
  <text x="384" y="94" fill="#3f4247" font-size="15" font-weight="700">light</text>
  <text x="430" y="94" fill="#5b6068" font-size="12" font-family="ui-monospace, Menlo, monospace">data-theme="light" (기본)</text>
  <rect x="384" y="112" width="32" height="32" rx="6" fill="#e1eeff" stroke="#bfd8f7"/>
  <text x="428" y="133" fill="#3f4247" font-size="13" font-family="ui-monospace, Menlo, monospace">→ --tide-color-blue-100  #e1eeff</text>
  <rect x="384" y="156" width="96" height="34" rx="8" fill="#e1eeff" stroke="#bfd8f7"/>
  <text x="432" y="178" fill="#003568" font-size="14" font-weight="700" text-anchor="middle">추가</text>
  <text x="496" y="178" fill="#5b6068" font-size="12">subtle Button — 파스텔 바탕 + 진한 같은 색 글자</text>

  <!-- dark 패널 -->
  <rect x="360" y="224" width="530" height="140" rx="12" fill="#28292c" stroke="#5b6068"/>
  <text x="384" y="254" fill="#f5f5f6" font-size="15" font-weight="700">dark</text>
  <text x="430" y="254" fill="#bec1c4" font-size="12" font-family="ui-monospace, Menlo, monospace">data-theme="dark"</text>
  <rect x="384" y="272" width="32" height="32" rx="6" fill="#003568" stroke="#004e94"/>
  <text x="428" y="293" fill="#f5f5f6" font-size="13" font-family="ui-monospace, Menlo, monospace">→ --tide-color-blue-950  #003568</text>
  <rect x="384" y="316" width="96" height="34" rx="8" fill="#003568" stroke="#004e94"/>
  <text x="432" y="338" fill="#e1eeff" font-size="14" font-weight="700" text-anchor="middle">추가</text>
  <text x="496" y="338" fill="#bec1c4" font-size="12">같은 Button, 바탕과 글자 단계만 뒤집힌다</text>

  <!-- 하단 설명 -->
  <text class="note" x="460" y="398" font-size="14" font-weight="700" text-anchor="middle">&lt;html&gt;에 주면 페이지 전체, 요소에 주면 그 안쪽만 — OS 설정을 따를지는 앱이 정한다</text>
</svg>
