<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="920" height="450" rx="16" fill="#1a1a1a"/>

  <text x="460" y="40" fill="#f0f0f0" font-size="18" font-weight="700" text-anchor="middle">패키지 셋 — 앱은 components와 icons를 설치한다</text>

  <!-- 앱 -->
  <rect x="30" y="100" width="150" height="80" rx="10" fill="#3a3a3a" stroke="#9a9a9a"/>
  <text x="105" y="136" fill="#f0f0f0" font-size="18" font-weight="700" text-anchor="middle">앱</text>
  <text x="105" y="158" fill="#bdbdbd" font-size="12" text-anchor="middle">Next.js 등</text>

  <!-- 같은 버전 묶음 -->
  <rect x="240" y="62" width="430" height="300" rx="14" fill="none" stroke="#65a1f9" stroke-dasharray="6 5"/>
  <text x="260" y="84" fill="#a7c0e3" font-size="14" font-weight="700">TDS — 언제나 같은 버전으로 함께 릴리스</text>

  <!-- components -->
  <rect x="270" y="102" width="370" height="76" rx="10" fill="#113465" stroke="#65a1f9"/>
  <text x="455" y="135" fill="#e3eefd" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">@tide-tds/components</text>
  <text x="455" y="158" fill="#a7c0e3" font-size="12" text-anchor="middle">React Component + 앱이 불러오는 styles.css</text>

  <!-- icons -->
  <rect x="270" y="262" width="175" height="76" rx="10" fill="#412963" stroke="#c4b5e4"/>
  <text x="357" y="295" fill="#f0e9ff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">@tide-tds/icons</text>
  <text x="357" y="318" fill="#c4b5e4" font-size="12" text-anchor="middle">아이콘 Component</text>

  <!-- foundation -->
  <rect x="465" y="262" width="175" height="76" rx="10" fill="#11403e" stroke="#91cbc6"/>
  <text x="552" y="295" fill="#d7f4f1" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">@tide-tds/foundation</text>
  <text x="552" y="318" fill="#91cbc6" font-size="12" text-anchor="middle">Token · CSS · tide-color CLI</text>

  <!-- Tailwind -->
  <rect x="720" y="262" width="170" height="76" rx="10" fill="none" stroke="#777" stroke-dasharray="4 4"/>
  <text x="805" y="295" fill="#e8e8e8" font-size="15" font-weight="700" text-anchor="middle">Tailwind CSS 4</text>
  <text x="805" y="318" fill="#9a9a9a" font-size="12" text-anchor="middle">앱이 설치 (peer)</text>

  <!-- 화살표 -->
  <line x1="180" y1="140" x2="268" y2="140" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="357" y1="178" x2="357" y2="260" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="552" y1="178" x2="552" y2="260" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="300" x2="718" y2="300" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="679" y="290" fill="#9a9a9a" font-size="11" text-anchor="middle">theme 연결</text>
  <!-- 앱 → icons 직접 -->
  <path d="M105,180 V392 H357 V340" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="384" fill="#9a9a9a" font-size="12">앱도 직접 설치 (pnpm은 전이 의존성을 import하지 못하게 막는다)</text>

  <!-- 하단 설명 -->
  <text x="460" y="428" fill="#65a1f9" font-size="14" font-weight="700" text-anchor="middle">foundation은 components와 함께 설치된다 — 앱이 따로 설치하지 않아도 된다</text>
</svg>
