<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Tide 대표 아이콘. tide-web 파비콘(apps/tide-admin/src/app/icon.svg)과 같은 그림이다.
    tide 색 토큰: 바탕 blue-500 → blue-700(primary-solid는 blue-600), 작은 물방울 blue-200, 윤곽 blue-600.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#148cfc" />
      <stop offset="1" stop-color="#0060b3" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)" />
  <path fill="#ffffff" d="M19 6.05C21.45 10.25 26 14.45 26 19A7 7 0 0 1 12 19C12 14.45 16.55 10.25 19 6.05Z" />
  <path fill="#bfd8f7" stroke="#2f6fe0" stroke-width="1.6" stroke-linejoin="round" d="M10.5 12.73C11.97 15.25 14.7 17.77 14.7 20.5A4.2 4.2 0 0 1 6.3 20.5C6.3 17.77 9.03 15.25 10.5 12.73Z" />
</svg>
