# main push마다 Version PR을 만들거나, 머지된 뒤면 검사 → npm publish(OIDC) → GitHub Release → 문서 배포를 잇는다(ADR 0008·0020·0021).
# npm trusted publisher 설정의 workflow 파일 이름이 이 파일이다. 이름을 바꾸면 npm 설정도 바꾼다.
# workflow_dispatch로 실행하면 문서 배포만 다시 한다.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 기본 권한을 비우고 job마다 필요한 것만 준다.
permissions: {}

# 진행 중인 publish를 끊지 않는다. queue 기본값은 기존 pending을 취소해 publish 실행이 빠질 수 있어 max로 둔다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # changeset이 있으면 version, registry에 없는 버전이 있으면 publish, 아니면 none(empty changeset만 있어도 none).
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Version PR 브랜치에 커밋
      pull-requests: write # Version PR 만들기·갱신
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # @changesets/changelog-github가 changeset을 더한 커밋과 PR을 찾으려면 히스토리가 필요하다.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # 액션의 pr-title에는 버전 자리 표시자가 없어 제목을 미리 계산한다(scripts/version-pr-title.ts, ADR 0020·0021).
      - id: next
        run: |
          pnpm changeset status --output="$RUNNER_TEMP/changeset-status.json"
          title=$(node scripts/version-pr-title.ts "$RUNNER_TEMP/changeset-status.json")
          echo "title=$title" >> "$GITHUB_OUTPUT"
      # changeset version 뒤 CHANGELOG의 고정 영어 문구를 한글로 바꾼다(scripts/changelog-ko.ts).
      # GitHub App 신원으로 Version PR을 만든다. GITHUB_TOKEN이 만든 PR은 CI에 사람 승인이 필요하다(docs/research/bot-pr-workflow-approval.md).
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: version
        uses: changesets/action/version@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm release:version
          commit-message: "chore: 릴리스 버전 올리기"
          pr-title: ${{ steps.next.outputs.title }}
      # Version PR에 push한 사람을 assignee로, `release` 라벨을 더한다. PR의 assignee·라벨은 Issues API로 바꾼다.
      - if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
          ACTOR: ${{ github.actor }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f "assignees[]=$ACTOR" --silent
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=release" --silent

  # Version PR이 머지된 뒤: 전체 검사를 다시 돌리고 tarball을 만든다.
  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # ci.yml과 같은 Playwright 공식 이미지에서 돌려 apt(Ubuntu 미러)에 기대지 않는다.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tide-design/components exec playwright install --only-shell chromium
      # --affected 없이 전체를 돌린다. build 결과(dist)가 그대로 pack에 들어간다.
      - run: pnpm turbo run typecheck test build smoke
      # changeset pack이 pnpm pack을 불러서 workspace:·catalog:가 실제 버전으로 바뀐다(@changesets/cli 3.0.3).
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 패키지별 git tag push
      id-token: write # npm trusted publishing(OIDC). provenance도 이것으로 붙는다.
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # pack job의 tarball을 올린다. pnpm이 OIDC 토큰으로 인증하고 provenance를 붙인다.
      # tag는 패키지마다 만들고, GitHub Release는 아래 job에서 하나로 만든다.
      - id: publish
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: false
          push-git-tags: true

  github-release:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release와 그 tag(v0.2.0) 만들기
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: notes
        env:
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.published-packages }}
        run: echo "version=$(node scripts/release-notes.ts "$RUNNER_TEMP/release-notes.md")" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: >-
          gh release create "v$VERSION"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "v$VERSION"
          --notes-file "$RUNNER_TEMP/release-notes.md"

  # main의 Storybook 버전에 tag가 없으면 release=true(scripts/storybook-release.ts). tag는 storybook-tag job이 만든다(ADR 0020).
  storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: detect
        run: node scripts/storybook-release.ts >> "$GITHUB_OUTPUT"

  # Dokploy 문서 배포를 요청하고 끝날 때까지 기다린다. TDS publish, Storybook만 릴리스(mode none), 수동 실행 때 배포한다.
  # mode가 version이면 npm에 없는 Component가 먼저 나가지 않게 배포하지 않는다. 실패해도 npm 릴리스는 되돌리지 않는다.
  docs:
    needs: [select-mode, publish, storybook]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.outputs.published == 'true' || (needs.storybook.outputs.release == 'true' && needs.select-mode.outputs.mode == 'none')) }}
    runs-on: ubuntu-latest
    # 스크립트의 배포 대기 타임아웃(15분)보다 조금 길게 둔 안전장치다.
    timeout-minutes: 20
    environment: docs
    permissions:
      contents: read # 배포 스크립트를 받으려고 checkout
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # 요청 뒤 새 배포의 status를 폴링해 성공·실패를 정한다(scripts/dokploy-deploy.ts). API 키는 환경 변수로만 넘기고 출력하지 않는다.
      - env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: node scripts/deploy-docs.ts

  # Storybook tag는 문서 배포가 성공한 뒤에 만든다. 실패하면 tag가 없어 다음 실행에서 다시 배포한다.
  storybook-tag:
    needs: [storybook, docs]
    if: ${{ !cancelled() && needs.docs.result == 'success' && needs.storybook.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag 만들기
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.storybook.outputs.tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
