# PR마다 lint, format, changeset 규칙, 바뀐 패키지의 typecheck·test·build·smoke를 돌린다.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Playwright 공식 이미지에서 돌려 apt(Ubuntu 미러) 장애를 피한다(docs/research/ci-apt-mirror-outage.md).
    # 태그는 catalog의 playwright 버전과 맞춘다.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected가 base 브랜치와 비교하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      # package.json의 packageManager 버전을 읽는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 원격 캐시 대신 .turbo를 GitHub Actions cache에 둔다.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      # Chromium headless shell. 이미지와 버전이 같으면 받지 않고, 어긋나도 apt 없이 브라우저만 받는다.
      - run: pnpm --filter @tide-design/components exec playwright install --only-shell chromium
      - run: pnpm lint
      - run: pnpm format:check
      # changeset 규칙은 scripts/check-changesets.ts(ADR 0020). Version PR은 changeset을 지우는 PR이라 건너뛴다.
      - if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changesets.ts "origin/$BASE_REF"
      # 루트 scripts/ 단위 테스트는 패키지가 아니라서 turbo 밖에서 돈다.
      - run: pnpm test:scripts
      - run: pnpm turbo run typecheck test build smoke --affected
