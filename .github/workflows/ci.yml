# PR마다 lint, format, changeset 규칙, 그리고 바뀐 패키지의 typecheck·test·build·smoke를 돌린다.
# 액션 버전: actions/checkout v7, pnpm/action-setup v6, actions/setup-node v7, actions/cache v6 (2026-11-10 확인)
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Playwright 공식 이미지(브라우저·시스템 의존성·폰트·git·zstd 포함, Dockerfile.noble v1.65.0 확인)에서 돌린다.
    # 러너에서 `--with-deps`로 apt를 쓰면 Ubuntu 미러 장애 때 CI가 막힌다(docs/research/ci-apt-mirror-outage.md).
    # 태그는 catalog의 playwright 버전과 맞춘다. `--user 1001`은 playwright.dev/docs/ci GitHub Actions 예시를 따른다.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --affected가 base 브랜치와 비교하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      # package.json의 packageManager(pnpm@12.18.0)를 읽는다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 원격 캐시 대신 .turbo를 GitHub Actions cache에 둔다.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      # browser·storybook project가 쓰는 Chromium headless shell. 이미지 태그와 버전이 같으면 이미 있어 아무것도 받지 않는다.
      # 버전이 어긋나도 apt 없이 Playwright CDN에서 브라우저만 받는다(--with-deps 쓰지 않음).
      - run: pnpm --filter @tide-tds/components exec playwright install --only-shell chromium
      - run: pnpm lint
      - run: pnpm format:check
      # changeset 규칙: packages/*를 바꿨으면 changeset 필수(문서·설정만이면 필요 없음, 릴리스가 필요 없으면 empty),
      # 0.x 동안 major 금지, 아이콘 이름표 키가 빠지면 icons minor 필수(scripts/check-changesets.ts).
      # Version PR(changeset-release/*)은 changeset을 지우는 PR이라 건너뛴다(changesets.dev 「Automating Changesets」).
      - if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changesets.ts "origin/$BASE_REF"
      - run: pnpm turbo run typecheck test build smoke --affected
